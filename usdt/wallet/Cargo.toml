[package]
name = "usdt-fixture-wallet"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bitkitcore = { path = "../../.usdt/core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
debug = 0
