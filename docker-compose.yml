x-trezor-user-env-image: &trezor_user_env_image ghcr.io/trezor/trezor-user-env@sha256:15871ebb234bf7c0197cfcd31ddc2edbe90173cd6386fc0283fafe05bf888c06

services:
  bitcoind:
    container_name: bitcoin
    image: btcpayserver/bitcoin:26.0
    restart: unless-stopped
    expose:
      - '43782'
      - '39388'
    ports:
      - '43782:43782'
      - '39388:39388'
    volumes:
      - 'bitcoin_home:/home/bitcoin/.bitcoin'
    environment:
      BITCOIN_NETWORK: ${NBITCOIN_NETWORK:-regtest}
      CREATE_WALLET: 'true'
      BITCOIN_WALLETDIR: '/walletdata'
      BITCOIN_EXTRA_ARGS: |
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        maxmempool=500
        rpcauth=polaruser:5e5e98c21f5c814568f8b55d83b23c1c$$066b03f92df30b11de8e4b1b1cd5b1b4281aa25205bd57df9be82caf97a05526
        txindex=1
        fallbackfee=0.00002 # matches ldk-node fallback rate for ChannelCloseMinimum = 500 sat/kwu = 2 sat/vByte
        zmqpubrawblock=tcp://0.0.0.0:28334
        zmqpubrawtx=tcp://0.0.0.0:28335
        zmqpubhashblock=tcp://0.0.0.0:28336

  bitcoinsetup:
    image: btcpayserver/bitcoin:26.0
    depends_on:
      - bitcoind
    restart: 'no'
    volumes:
      - 'bitcoin_home:/home/bitcoin/.bitcoin'
    user: bitcoin
    # generate one block so electrs stop complaining
    entrypoint:
      [
        'bash',
        '-c',
        'sleep 1; while ! bitcoin-cli -rpcconnect=bitcoind -generate 1; do sleep 1; done',
      ]

  electrs:
    container_name: electrum
    image: getumbrel/electrs:v0.10.2
    restart: unless-stopped
    depends_on:
      - bitcoind
    expose:
      - '60001'
      - '28334'
      - '28335'
      - '28336'
    ports:
      - '60001:60001'
    volumes:
      - './electrs.toml:/data/electrs.toml'
    environment:
      - ELECTRS_NETWORK=regtest
      - ELECTRS_ELECTRUM_RPC_ADDR=electrs:60001
      - ELECTRS_DAEMON_RPC_ADDR=bitcoind:43782
      - ELECTRS_DAEMON_P2P_ADDR=bitcoind:39388
      - ELECTRS_LOG_FILTERS=INFO

  darkhttpd:
    image: p3terx/darkhttpd:1.16
    restart: unless-stopped
    depends_on:
      - bitcoinsetup
    expose:
      - '80'
    ports:
      - '80:80'
    volumes:
      - './btc-fee-estimates.json:/www/btc-fee-estimates.json'
    command:
      - '/www'

  lnd:
    container_name: lnd
    image: polarlightning/lnd:0.18.0-beta
    restart: unless-stopped
    depends_on:
      - bitcoind
    expose:
      - '8080' # REST
      - '9735' # P2P
      - '10009' # RPC
    ports:
      - '8080:8080'
      - '9735:9735'
      - '10009:10009'
    volumes:
      - './lnd:/home/lnd/.lnd/'
    command:
      - '--noseedbackup'
      - '--alias=lnd'
      - '--externalip=127.0.0.1'
      - '--bitcoin.active'
      - '--bitcoin.regtest'
      - '--bitcoin.node=bitcoind'
      - '--bitcoind.rpchost=bitcoind:43782'
      - '--bitcoind.rpcuser=polaruser'
      - '--bitcoind.rpcpass=polarpass'
      - '--bitcoind.zmqpubrawblock=tcp://bitcoind:28334'
      - '--bitcoind.zmqpubrawtx=tcp://bitcoind:28335'
      - '--debuglevel=info'
      - '--listen=0.0.0.0:9735'
      - '--rpclisten=0.0.0.0:10009'
      - '--restlisten=0.0.0.0:8080'
      - '--feeurl=http://darkhttpd:80/btc-fee-estimates.json'
      - '--protocol.option-scid-alias'
      - '--protocol.zero-conf'

  ldk-backup-server:
    container_name: ldk-backup-server
    image: synonymsoft/ldk-backup-server:0.0.146
    expose:
      - '3003'
    ports:
      - '3003:3003'
    environment:
      HOST: '0.0.0.0'
      PORT: '3003'
      SECRET_KEY: 'e3e2d2e410569be1f2219e1ef21f188f7ccff1ce721ea2624263d3fe9878f69e'
      PUBLIC_KEY: '0319c4ff23820afec0c79ce3a42031d7fef1dff78b7bdd69b5560684f3e1827675'

  lnurl-server:
    build: ./lnurl-server
    container_name: lnurl-server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DOMAIN=http://localhost:3000
      - DATABASE_URL=sqlite:///data/lnurl.db
      # Bitcoin node connection
      - BITCOIN_RPC_HOST=bitcoind
      - BITCOIN_RPC_PORT=43782
      - BITCOIN_RPC_USER=polaruser
      - BITCOIN_RPC_PASS=polarpass
      # LND connection
      - LND_REST_HOST=lnd
      - LND_REST_PORT=8080
      - LND_MACAROON_PATH=/lnd-certs/data/chain/bitcoin/regtest/admin.macaroon
      - LND_TLS_CERT_PATH=/lnd-certs/tls.cert
    volumes:
      - ./lnurl-server/data:/data
      - ./lnd:/lnd-certs:ro
    ports:
      - "3000:3000"

  lnurl-server-fixture:
    profiles: [lnurl-pay]
    image: bitkit-docker/lnurl-server:pay-fixture
    build:
      context: ./lnurl-server
      dockerfile: Dockerfile.pay-fixture
    environment:
      PORT: '3010'
      LNURL_FIXTURE_DOMAIN: ${LNURL_FIXTURE_DOMAIN:-}
    ports:
      - '3010:3010'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3010/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/v0_create_vss_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  homegate-postgres:
    container_name: homegate-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pubky_homegate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - homegate_postgres_data:/var/lib/postgresql/data
    ports:
      - "${HOMEGATE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pubky_homegate"]
      interval: 10s
      timeout: 5s
      retries: 5

  homegate-admin-mock:
    container_name: homegate-admin-mock
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      HOMEGATE_ADMIN_MOCK_HOST: 0.0.0.0
      HOMEGATE_ADMIN_MOCK_PORT: 6289
      HOMEGATE_ADMIN_MOCK_PASSWORD: ${HOMEGATE_ADMIN_MOCK_PASSWORD:-admin}
      HOMEGATE_ADMIN_MOCK_PUBKY: ${HOMEGATE_ADMIN_MOCK_PUBKY:-ufibwbmed6jeq9k4p583go95wofakh9fwpp4k734trq79pd9u1uy}
    volumes:
      - ./homegate-admin-mock:/app:ro
    expose:
      - "6289"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6289/info', { headers: { 'X-Admin-Password': process.env.HOMEGATE_ADMIN_MOCK_PASSWORD || 'admin' } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  lnurl-auth-server:
    container_name: lnurl-auth-server
    image: lnurl-auth-server:latest
    build:
      context: ../lnurl-auth-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5005
      - SERVER_DOMAIN=${DOMAIN:-http://localhost:5005}
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - JWT_EXPIRES_IN=24h
      - CHALLENGE_EXPIRATION_MS=300000
      - CHALLENGE_CLEANUP_INTERVAL_MS=60000
      - CHALLENGE_LIMIT_MAX=10000
      - LOG_LEVEL=info
      - DB_PATH=/app/data/auth.db
      - DB_MAX_MB=100
    volumes:
      - ./lnurl-server/keys:/app/keys:ro
      - lnurl_auth_data:/app/data
    ports:
      - "5005:5005"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  vss-server:
    container_name: vss-server
    image: vss-server:latest
    build:
      context: ./vss-server
      dockerfile: rust/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      lnurl-auth-server:
        condition: service_healthy
    environment:
      - VSS_SERVER_HOST=0.0.0.0
      - VSS_SERVER_PORT=5050
      - VSS_POSTGRESQL_HOST=postgres
      - VSS_POSTGRESQL_PORT=5432
      - VSS_POSTGRESQL_DATABASE=postgres
      - VSS_POSTGRESQL_USERNAME=postgres
      - VSS_POSTGRESQL_PASSWORD=postgres
      - VSS_JWT_PUBLIC_KEY=-----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0UY2NeRbDpDHYVWWJPcx
        dcnRD6KG205/jg8ei4FF4YtUKBvgEB0wuRkLdHkPfx4fXFRJELIFveYtWUOWwFMG
        UDfMZDKwb6eMQw9bm2UjHc4CE6jOi1E5q93dPfD8Pyq6xdOY6/FkDX2Pa+Piz07b
        7/1jWLbEtX02thPqcsNryBQC69QGhRHhXWt+uXhN72V/uTfoWObS8v7gLZuga3y+
        dEKrtnmIYdW86XxBnWbeiujmqVCf2AnNiXgL+GwGOcksprYXmWXCvOojLK0C/H9d
        eda1vOI7kpA+rseM6Egc43UsEZrZPmuO7C7l6brTl/ZJTAbwvBa7jPQ2ncH7cb86
        TwIDAQAB
        -----END PUBLIC KEY-----
    volumes:
      - ./vss-server-config.toml:/app/vss-server-config.toml:ro
    ports:
      - "5050:5050"

  homegate:
    container_name: homegate
    image: homegate:latest
    build:
      context: ./homegate
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      homegate-postgres:
        condition: service_healthy
      homegate-admin-mock:
        condition: service_healthy
    volumes:
      - homegate_data:/root/.homegate
      - ./homegate-config.toml:/root/.homegate/config.toml:ro
    ports:
      - "${HOMEGATE_PORT:-6288}:6288"

  # Disposable, automatically initialized emulator for isolated test projects.
  # Its firmware and Bridge come from the same digest as the manual User Env.
  trezor-emulator:
    profiles: [trezor-emulator]
    image: bitkit-docker/trezor-emulator:fixture-v1
    build:
      context: ./scripts
      dockerfile: trezor-fixture.Dockerfile
    restart: "no"
    environment:
      MACOS: "1" # use published ports rather than physical USB / host networking
      TREZOR_MODEL: T2T1
      TREZOR_FIRMWARE: 2-main # frozen in the pinned base image
      TREZOR_BRIDGE_VERSION: node-bridge
      TREZOR_MNEMONIC: all all all all all all all all all all all all
      TREZOR_LABEL: Bitkit Test Trezor
      TREZOR_WIPE: "true"
    ports:
      - "127.0.0.1:21325:21325" # Bridge legacy API used by Bitkit
      - "127.0.0.1:21328:21328" # Bridge current API
      - "127.0.0.1:9004:9001" # controller; avoids marketplace port 3001 seat blocks
      - "127.0.0.1:9005:9002" # dashboard
      - "127.0.0.1:6080:6080" # emulator screen / noVNC
    volumes:
      - trezor_emulator_state:/var/tmp
      - trezor_emulator_logs:/trezor-user-env/logs
    healthcheck:
      test: ["CMD", "/trezor-user-env/.venv/bin/python3", "/opt/bitkit-trezor/trezor-fixture.py", "--health"]
      interval: 5s
      timeout: 20s
      retries: 6
      start_period: 120s
    stop_grace_period: 20s

  trezor-user-env-mac:
    image: *trezor_user_env_image
    ports:
      - "9001:9001"   # User Env controller websocket
      - "9002:9002"   # User Env dashboard
      - "21325:21325" # Trezor Bridge legacy port used by Bitkit
      - "21328:21328" # Trezor Bridge current port
      - "15900:5900"  # VNC port, offset to avoid local VNC conflicts
      - "6080:6080"   # noVNC web viewer
      - "9003:9003"   # MCP server SSE transport
    environment:
      - MACOS=1
      - REGTEST_RPC_URL=http://host.docker.internal:43782
    volumes:
      - ./.trezor-user-env/trezor-suite:/trezor-user-env/trezor-suite
      - ./.trezor-user-env/logs/screens:/trezor-user-env/logs/screens
      - ./.trezor-user-env/logs/mcp-screenshots:/trezor-user-env/logs/mcp-screenshots
      - ./.trezor-user-env/firmware/user_downloaded:/trezor-user-env/src/binaries/firmware/bin/user_downloaded

  trezor-user-env-linux:
    image: *trezor_user_env_image
    profiles:
      - trezor-linux
    network_mode: "host"
    environment:
      - PHYSICAL_TREZOR=${PHYSICAL_TREZOR:-}
    volumes:
      - ./.trezor-user-env/trezor-suite:/trezor-user-env/trezor-suite
      - ./.trezor-user-env/logs/screens:/trezor-user-env/logs/screens
      - ./.trezor-user-env/logs/mcp-screenshots:/trezor-user-env/logs/mcp-screenshots
      - ./.trezor-user-env/firmware/user_downloaded:/trezor-user-env/src/binaries/firmware/bin/user_downloaded

  # ---------------------------------------------------------------------------
  # Pubky marketplace fixture (profile "marketplace"). Not started by a plain
  # `docker compose up`. Drive it with ./pubky-marketplace; see docs/pubky-marketplace.md.
  # bitcoind and electrs above are the chain half of the fixture (Electrum on 60001).
  # ---------------------------------------------------------------------------
  marketplace-postgres:
    profiles: [marketplace]
    container_name: marketplace-postgres
    image: postgres:16-alpine
    restart: "no" # the fixture is disposable: a restarted testnet loses its accounts
    environment:
      POSTGRES_DB: paykit
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
      - ./marketplace/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d paykit"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Pubky Core static testnet: DHT, PKARR relay, HTTP relay and one homeserver.
  # The pinned Pubky clients (Bitkit E2E builds, Paykit Server) resolve this
  # testnet on fixed localhost ports, so those ports are published unchanged on
  # the host loopback and paykit-server and marketplace-driver join this
  # container's network namespace.
  pubky-testnet:
    profiles: [marketplace]
    container_name: marketplace-pubky-testnet
    # The homeserver of 0.14.0 answers the Pubky SDK's LOCK and UNLOCK write locks that current Bitkit builds take before writing Paykit state; the
    # earlier Pubky Core pin (f68014c1) answered 405.
    image: bitkit-docker/pubky-testnet:0.14.0
    build:
      context: ./marketplace/pubky-testnet
    restart: "no" # the fixture is disposable: a restarted testnet loses its accounts
    depends_on:
      marketplace-postgres:
        condition: service_healthy
    command: ["pubky-testnet", "--homeserver-config", "/etc/pubky-homeserver/config.toml"]
    volumes:
      - ./marketplace/homeserver.toml:/etc/pubky-homeserver/config.toml:ro
    ports:
      - "127.0.0.1:6881:6881/udp"
      - "127.0.0.1:6881:6881/tcp"
      - "127.0.0.1:15411:15411" # PKARR relay
      - "127.0.0.1:15412:15412" # HTTP relay
      - "127.0.0.1:6286:6286" # homeserver ICANN HTTP
      - "127.0.0.1:6287:6297" # homeserver Pubky TLS, through homeserver-proxy (in-namespace clients reach the homeserver on 6287 directly)
      - "127.0.0.1:6298:6298" # homeserver-proxy control: delay or fail one identity's requests
      - "127.0.0.1:${MARKETPLACE_HOMESERVER_ADMIN_PORT:-16288}:6288" # homeserver admin (6288 is homegate's)
      - "127.0.0.1:${MARKETPLACE_PAYKIT_PORT:-3001}:3001" # paykit-server, shares this namespace
      - "127.0.0.1:3012:3012" # opt-in fixture-issuer, shares this namespace
      - "127.0.0.1:3013:3013" # opt-in rc56-peer, shares this namespace

  # Paykit Server 0ffd4da, the head of pubky/paykit-server#46 (paykit-rs rc65, the version both apps pin; Pubky 0.14.0; move to its merge or
  # release once #46 lands), built from source with the upstream
  # Dockerfile.local. Its setup flow emits the Pubky grant auth URL (cid and cpk)
  # that the apps' Paykit SDK requires. `./pubky-marketplace build` first checks
  # out the pinned trees under .marketplace/sources and confirms that the tree's
  # Cargo.lock resolves paykit-rs and locks to them; Dockerfile.local then fails
  # closed if a tree differs from the pins in Paykit Server's Cargo manifests.
  paykit-server:
    profiles: [marketplace]
    container_name: marketplace-paykit-server
    image: bitkit-docker/paykit-server:${PAYKIT_SERVER_TAG:-0ffd4da}
    build:
      context: ./.marketplace/sources/paykit-server
      dockerfile: Dockerfile.local
      labels:
        tech.masivo.paykit-server: ${PAYKIT_SERVER_REV:-0ffd4da2adaab048939e0ea18ff916a27a7cfb0e}
        tech.masivo.paykit-rs: ${PAYKIT_RS_REV:-7185ae7da9315028e5331442d71d739c27f1442c}
        tech.masivo.paykit-server-patches: ${PAYKIT_SERVER_PATCHES:-paykit-server-reader-accepts-proposal-expiry.patch}
      additional_contexts:
        paykit-lib: ./.marketplace/sources/paykit-rs/paykit-lib
        paykit-sdk: ./.marketplace/sources/paykit-rs/paykit-sdk
        locks: ./.marketplace/sources/locks
    restart: "no" # the fixture is disposable: a restarted testnet loses its accounts
    network_mode: service:pubky-testnet
    depends_on:
      marketplace-postgres:
        condition: service_healthy
      electrs:
        condition: service_started
      pubky-testnet:
        condition: service_started
    environment:
      PAYKIT_CONFIG: /state/paykit/paykit-server.toml
      PAYKIT_DATABASE_URL: postgres://marketplace:marketplace@marketplace-postgres:5432/paykit
    volumes:
      - marketplace_state:/state:ro
    # The master key and the generated config live in /state/paykit, written by
    # `marketplace-driver init`; they never appear in compose or inspect output.
    # The driver's seeds sit in /state/secrets (mode 0700, root), out of this
    # container's reach.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -s /state/paykit/paykit-server.toml ] && [ -s /state/paykit/master-key ]; do
          echo '[marketplace] waiting for marketplace-driver init'
          sleep 1
        done
        PAYKIT_MASTER_KEY="$$(cat /state/paykit/master-key)"
        export PAYKIT_MASTER_KEY
        exec /usr/local/bin/paykit-server

  # The fixture driver. Runs one-shot commands (`docker compose run`) through
  # the ./pubky-marketplace wrapper. It carries the paykit-companion-auth and
  # paykit-reader-demo helper binaries from the paykit-server image.
  marketplace-driver:
    profiles: [marketplace]
    image: bitkit-docker/marketplace-driver:${PAYKIT_SERVER_TAG:-0ffd4da}
    build:
      context: ./marketplace/driver
      additional_contexts:
        paykit: service:paykit-server
        fixture: docker-image://bitkit-docker/payment-request-fixture:rc65-shared
      labels:
        tech.masivo.paykit-server: ${PAYKIT_SERVER_REV:-0ffd4da2adaab048939e0ea18ff916a27a7cfb0e}
        tech.masivo.paykit-rs: ${PAYKIT_RS_REV:-7185ae7da9315028e5331442d71d739c27f1442c}
    network_mode: service:pubky-testnet
    depends_on:
      - pubky-testnet
    environment:
      BITCOIN_RPC_URL: http://bitcoind:43782
      BITCOIN_RPC_USER: polaruser
      BITCOIN_RPC_PASS: polarpass
      PAYKIT_URL: http://127.0.0.1:3001
    volumes:
      - marketplace_state:/state
      - ./.marketplace/evidence:/evidence
    entrypoint: ["node", "/app/driver.mjs"]

  # Pubky TLS proxy in front of the testnet homeserver: the apps reach the homeserver through it (the host's 6287 above).
  # It presents the static testnet's homeserver key and forwards to the homeserver's plain HTTP on 6286; its control port
  # (6298) delays or fails the requests of one identity and path (README, Homeserver proxy). Without rules it only forwards.
  homeserver-proxy:
    profiles: [marketplace]
    image: bitkit-docker/payment-request-fixture:rc65-shared
    build: ./payment-requests
    restart: on-failure
    network_mode: service:pubky-testnet
    depends_on:
      - pubky-testnet
    entrypoint: ["/usr/local/bin/homeserver-proxy"]

  # The rc65 SDK peers (paykit-rs 7185ae7, the version both apps pin) share the marketplace testnet namespace and regtest chain. The service name `rc56-peer` stays: lanes and journeys address the peer by it.
  fixture-issuer:
    profiles: [payment-requests]
    image: bitkit-docker/payment-request-fixture:rc65-shared
    build: ./payment-requests
    restart: "no"
    network_mode: service:pubky-testnet
    depends_on:
      - pubky-testnet
      - bitcoind
    environment:
      FIXTURE_ROLE: fixture-issuer
      FIXTURE_PORT: 3012
      BITCOIN_RPC_URL: http://bitcoind:43782

  rc56-peer:
    profiles: [payment-requests]
    image: bitkit-docker/payment-request-fixture:rc65-shared
    build: ./payment-requests
    restart: "no"
    network_mode: service:pubky-testnet
    depends_on:
      - pubky-testnet
      - bitcoind
    environment:
      FIXTURE_ROLE: rc56-peer
      FIXTURE_PORT: 3013
      BITCOIN_RPC_URL: http://bitcoind:43782

volumes:
  trezor_emulator_state:
  trezor_emulator_logs:
  bitcoin_home:
  postgres_data:
  lnurl_auth_data:
  homegate_postgres_data:
  homegate_data:
  marketplace_postgres_data:
  marketplace_state:

networks: {}
