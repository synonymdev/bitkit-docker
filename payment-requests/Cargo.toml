[package]
name = "bitkit-payment-request-fixture"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
paykit-lib = { git = "https://github.com/pubky/paykit-rs.git", rev = "f2c5f7127b1cb0f29052ce76e43f3c0ae468fd12" }
paykit-sdk = { git = "https://github.com/pubky/paykit-rs.git", rev = "f2c5f7127b1cb0f29052ce76e43f3c0ae468fd12" }
pubky = "=0.14.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
